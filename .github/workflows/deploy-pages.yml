# Gera os catálogos estáticos, valida o projeto e publica o build no GitHub Pages.
name: Publicação do site estático

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Preparar site estático
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar dependências
        run: npm install

      - name: Gerar catálogo web de áudio humano
        run: npm run audio:web-catalog

      - name: Baixar áudios humanos dos pares tonais
        run: npm run tone-pairs:sync

      - name: Gerar catálogo de radicais
        run: npm run radicals:sync

      - name: Validar TypeScript
        run: npm run typecheck

      - name: Gerar site estático
        run: npm run build

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Enviar artefato do site
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    name: Publicar no GitHub Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Publicar site
        id: deployment
        uses: actions/deploy-pages@v4
