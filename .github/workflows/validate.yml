# Valida segurança, sincronização de dados, tipos, testes E2E e build antes de integrar alterações.
name: Validação do projeto

on:
  pull_request:
    branches: [main]
  push:
    branches: [dev]

jobs:
  build:
    name: Validar aplicação
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar dependências
        run: npm install

      - name: Auditar dependências de alta severidade
        run: npm audit --audit-level=high

      - name: Validar scripts de sincronização
        run: |
          node --check scripts/sync-human-audio.mjs
          node --check scripts/sync-web-audio-catalog.mjs
          node --check scripts/sync-tone-pair-audio.mjs
          node --check scripts/sync-sentence-audio.mjs
          node --check scripts/sync-radicals.mjs

      - name: Gerar catálogo web de áudio humano
        run: npm run audio:web-catalog

      - name: Baixar áudios humanos dos pares tonais
        run: npm run tone-pairs:sync

      - name: Baixar frases humanas para treino auditivo
        run: npm run phrases:sync

      - name: Gerar catálogo de radicais
        run: npm run radicals:sync

      - name: Validar TypeScript
        run: npm run typecheck

      - name: Instalar navegador do Playwright
        run: npx playwright install --with-deps chromium

      - name: Executar testes automatizados no Playwright
        run: npm run test:e2e

      - name: Gerar build de produção
        run: npm run build
