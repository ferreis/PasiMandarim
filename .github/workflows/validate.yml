name: Validate

on:
  pull_request:
    branches: [main]
  push:
    branches: [dev]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Check data sync scripts
        run: |
          node --check scripts/sync-human-audio.mjs
          node --check scripts/sync-web-audio-catalog.mjs
          node --check scripts/sync-radicals.mjs

      - name: Generate human web audio catalog
        run: npm run audio:web-catalog

      - name: Generate radicals catalog
        run: npm run radicals:sync

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build
