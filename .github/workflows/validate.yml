name: Validate

on:
  pull_request:
    branches: [main]
  push:
    branches: [dev]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Check audio sync script
        run: node --check scripts/sync-human-audio.mjs

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build
